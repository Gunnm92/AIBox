# aibox : latence réduite sur la sortie du dongle DualSense (DS5Dongle).
# Des périodes ALSA de 128 trames (2,7 ms à 48 kHz), sans marge, raccourcissent
# le délai de la sortie : le récepteur ds5-usbip (/etc/aibox/ds5-usbip-rtp.conf)
# peut alors viser un tampon de 20 ms au lieu de 40 sans tomber dans le silence
# (« Delay to device is higher than the target buffer size »). Validé le
# 23/11/2026.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "DualSense Wireless Controller", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.headroom    = 0
        node.latency         = "128/48000"
      }
    }
  }
]
