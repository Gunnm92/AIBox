# HDMI de la TV en multicanal : le profil UCM (« HiFi ») de la carte HDMI
# d'AMD (pci-0000_c4_00.1) n'offre que des sorties stéréo. Sans UCM, les
# profils ALSA classiques proposent le 5.1 (hdmi-surround) et le 7.1
# (hdmi-surround71), selon ce que l'écran annonce : la TV Sony accepte 6
# canaux en PCM (FL FR LFE FC RL RR), 8 seulement en Dolby (flux compressés).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_c4_00.1" }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
