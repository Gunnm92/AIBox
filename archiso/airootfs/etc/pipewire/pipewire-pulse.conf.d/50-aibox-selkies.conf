# Sortie son du bureau d'administration (27/11/2026, repris de SteamBox) : puits
# virtuel « selkies », dont Selkies capture le moniteur
# (SELKIES_AUDIO_DEVICE_NAME=selkies.monitor, aibox-admin-selkies). Jamais la
# sortie par défaut : seules les applis du bureau y sortent (PULSE_SINK,
# admin-session), la TV garde la sienne.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=selkies sink_properties=device.description=Navigateur-Selkies" flags = [ ] }
]
