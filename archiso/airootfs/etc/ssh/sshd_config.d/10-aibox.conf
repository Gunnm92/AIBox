PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
# Clés d'hôte sur le disque de données (aibox-ssh-hostkeys.service)
HostKey /var/lib/aibox/ssh/ssh_host_ed25519_key
HostKey /var/lib/aibox/ssh/ssh_host_rsa_key
