# ds5-usbip : réception du son de la DualSense émise par SteamBox.
# Arguments de libpipewire-module-rtp-source, chargé par ds5-usbip.service
# (pw-cli) tant que la manette est allumée. Les lignes de commentaire sont
# retirées au chargement : pw-cli ne les accepte pas.
#
# Reçoit en RTP les 4 canaux de la DualSense émulée dans SteamBox (Sunshine
# de sunshine-ds avec LIBVIRTUALHID_DUALSENSE_RTP_CHANNELS=4, ou
# ds5-usbip-proto --rtp-channels 4) : haut-parleur de la manette (1-2) et
# haptiques HD (3-4), joués sur les canaux correspondants du DS5Dongle
# (sortie ds5_dongle_sink, nommée par la règle WirePlumber 51-ds5dongle.conf).
# Émetteur en 2 canaux (haptiques seules) : remettre audio.channels = 2 et
# audio.position = [ RL RR ], et adapter /usr/local/lib/aibox/ds5-usbip-link.
#
# Source : dépôt Gunnm92/ds5-usbip, client/pipewire/ds5-usbip-haptics.conf et
# docs/aibox.md.
#
# Le dongle doit être en mode « Off » (transmission native) : en mode
# « Replace » il ignore les canaux 3-4, en « Mix » il y ajoute la vibration
# tirée du son du jeu. Le mode se règle sur le dongle (portail DS5Dongle-Studio) ;
# côté aibox, « aibox ds5-mode » choisit si le loopback ds5-haptics-loopback
# envoie aussi le son du PC au dongle.
{
  # Réception en unicast sur toutes les interfaces.
  source.ip           = "0.0.0.0"
  source.port         = 46100
  # Tampon visé. Il doit dépasser le délai de la sortie du dongle (USB puis
  # Bluetooth) : sinon module-rtp-source ramène le tampon à zéro (« Delay to
  # device is higher than the target buffer size ») et ne joue que du silence.
  # 10 ms : silence ; 40 ms : validé le 22/11/2026.
  sess.latency.msec   = 40
  # Accepter un nouvel émetteur (redémarrage du serveur = nouveau SSRC).
  sess.ignore-ssrc    = true
  node.always-process = true
  # Format envoyé par ds5-usbip : L16 big-endian.
  audio.format        = "S16BE"
  audio.rate          = 48000
  audio.channels      = 4
  # Haut-parleur (FL FR) puis haptiques natives gauche / droite (RL RR).
  # En profil « Direct » (ACP), les canaux du dongle sont FL FR RL RR ; en
  # profil pro-audio, AUX0..AUX3 : remplacer alors par [ AUX0 AUX1 AUX2 AUX3 ]
  # (et dans ds5-usbip-link). Vérifier avec pw-link -l.
  audio.position      = [ FL FR RL RR ]
  stream.props = {
    node.name           = "ds5_usbip_haptics"
    node.description    = "DualSense : haut-parleur et haptiques (SteamBox)"
    # Jamais relié par WirePlumber : sans dongle, il se rabattait sur la
    # sortie par défaut (la TV), et le son de la manette devenait des
    # grésillements audibles. node.dont-fallback ne convient pas : le flux
    # disparaît quand la sortie n'est pas encore là et n'est jamais relié
    # ensuite (essais du 22/11/2026). ds5-usbip-link le relie aux 4 canaux de
    # ds5_dongle_sink, et à rien d'autre.
    node.autoconnect    = false
    stream.dont-remix   = true
  }
}
