# Réglages d'aibox update (mise à jour de l'image décidée par le LLM local).
# Pour les changer, copier ce fichier dans ~/.config/aibox/auto-update.conf.

# Build par aibox build : son dossier (disque de données) et la branche de
# GitHub (Gunnm92/AIBox) construite
BUILD_DIR="/var/lib/aibox/state/build"
BUILD_REF="main"
# Passerelle LLM (LiteLLM, API compatible OpenAI) et modèle qui décide :
# Muse-Glimmer-30B, en local sur le GPU (Lemonade). L'alias « auto » pouvait
# tomber sur le petit modèle NPU, qui ne rendait pas toujours un JSON lisible.
# La clé (LLM_API_KEY, sk-…) va dans ~/.config/aibox/auto-update.conf, jamais ici.
LLM_URL="http://127.0.0.1:4000/v1"
MODEL="Muse-Glimmer-30B-GGUF"
# Destinataire de hermes send (canal habituel de Discord)
NOTIFY_TO="discord"
