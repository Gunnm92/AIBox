# Réglages d'aibox-auto-update (mise à jour de l'image décidée par le LLM local).
# Pour les changer, copier ce fichier dans ~/.config/aibox/auto-update.conf.

# Build par aibox-build : son dossier (disque de données) et la branche de
# GitHub (Gunnm92/AIBox) construite
BUILD_DIR="/var/lib/aibox/state/build"
BUILD_REF="main"
# Lemonade (API compatible OpenAI) et modèle qui décide
LEMONADE_URL="http://127.0.0.1:13305/api/v1"
MODEL="Qwen3.8-35B-A3B-Distill"
# Destinataire de hermes send (canal habituel de Discord)
NOTIFY_TO="discord"
