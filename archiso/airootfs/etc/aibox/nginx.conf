# Accès web d'aibox (noVNC sur /, code-server sur /code/), lancé par aibox-admin-novnc.service
# (utilisateur default, uid 1000).
worker_processes 1;
pid /run/user/1000/aibox-nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    types_hash_max_size 4096;

    client_body_temp_path /run/user/1000/nginx-body;
    proxy_temp_path /run/user/1000/nginx-proxy;
    fastcgi_temp_path /run/user/1000/nginx-fastcgi;
    uwsgi_temp_path /run/user/1000/nginx-uwsgi;
    scgi_temp_path /run/user/1000/nginx-scgi;

    server {
        listen 6080 ssl;
        ssl_certificate /etc/aibox/novnc-tls.crt;
        ssl_certificate_key /etc/aibox/novnc-tls.key;

        # Mot de passe demandé par le navigateur, dans la connexion HTTPS ;
        # il protège aussi le WebSocket (même origine).
        auth_basic "aibox";
        auth_basic_user_file /etc/aibox/novnc.htpasswd;

        root /usr/share/novnc;
        index index.html;

        # Onglet du navigateur : « aibox » et une icône à part, pour ne pas la
        # confondre avec SteamBox (noVNC d'origine sinon).
        location = /aibox-icon.svg {
            alias /etc/aibox/novnc-icon.svg;
        }
        location = /vnc.html {
            sub_filter '<title>noVNC</title>' '<title>aibox</title>';
            sub_filter 'type="image/x-icon" href="app/images/icons/novnc.ico"' 'type="image/svg+xml" href="/aibox-icon.svg"';
            sub_filter_once on;
        }

        # code-server (VS Code dans le navigateur), même mot de passe.
        location = /code {
            return 301 /code/;
        }
        location /code/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            # Hôte avec le port : code-server compare Origin et Host (sinon WebSocket refusé).
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding gzip;
            proxy_read_timeout 1d;
            client_max_body_size 1g;
        }

        location = /websockify {
            proxy_pass http://127.0.0.1:5901;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 1d;
        }
    }
}
