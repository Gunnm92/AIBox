# Déchargement des modèles GPU de Lemonade (llm-unload). Pour changer ces
# réglages, copier ce fichier dans ~/.config/aibox/llm.conf.

# Minutes sans requête avant de décharger un modèle GPU (vérifié toutes les 5 min)
IDLE_MINUTES=30
# 1 : décharger les modèles GPU au démarrage de la session TV (mémoire pour le jeu)
TV_UNLOAD=1
# Appareils concernés (les modèles NPU restent chargés)
UNLOAD_DEVICES="gpu"
