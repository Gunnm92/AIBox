; xrdp d'aibox : passerelle RDP vers le bureau d'administration (le même que
; noVNC). xrdp parle VNC à une instance locale de wayvnc protégée par le mot de
; passe noVNC (aibox-admin-wayvnc-rdp.service) : pas de session X séparée.
[Globals]
ini_version=1
fork=true
port=3389
tcp_nodelay=true
tcp_keepalive=true
security_layer=tls
crypt_level=high
; Certificat HTTPS d'aibox (signé par la CA aibox)
certificate=/etc/aibox/novnc-tls.crt
key_file=/etc/aibox/novnc-tls.key
ssl_protocols=TLSv1.2, TLSv1.3
autorun=aibox
allow_channels=true
allow_multimon=false
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=/run/xrdp.log
LogLevel=INFO
EnableSyslog=true

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true

[aibox]
name=aibox
lib=libvnc.so
ip=127.0.0.1
port=5910
username=na
password=ask
