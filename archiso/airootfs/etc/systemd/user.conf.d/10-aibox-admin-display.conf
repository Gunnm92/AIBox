# Affichage du bureau d'administration (KWin imbriqué dans Selkies : lien
# wayland-admin, publié par session-env ; Xwayland :0 au démarrage de la
# machine) pour tout ce que lance le gestionnaire de l'utilisateur, dès son
# démarrage. Sans ceci, les services réveillés par D-Bus avant que Plasma ait
# poussé son affichage (portails…) restent sans affichage, et ce qu'ils lancent
# aussi. Plasma le remplace ensuite par le sien (startplasma). La session TV a
# son propre bus et n'y touche pas.
[Manager]
DefaultEnvironment=WAYLAND_DISPLAY=wayland-admin DISPLAY=:0 XDG_CURRENT_DESKTOP=KDE XDG_SESSION_TYPE=wayland
