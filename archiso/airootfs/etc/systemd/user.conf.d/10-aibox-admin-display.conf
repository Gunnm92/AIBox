# Affichage du bureau d'administration (wayland-0, :0) pour tout ce que lance
# le gestionnaire de l'utilisateur, dès son démarrage. Sans ceci, les services
# réveillés par D-Bus avant que labwc ait poussé son affichage (Thunar, portails…,
# au démarrage simultané du bureau et de la TV) restent sans affichage, et ce
# qu'ils lancent aussi : Ark (Qt, Flatpak) ouvert depuis Thunar plantait faute
# d'affichage. activation-env-admin le remet si la session TV l'a changé.
[Manager]
DefaultEnvironment=WAYLAND_DISPLAY=wayland-0 DISPLAY=:0 XDG_CURRENT_DESKTOP=XFCE XDG_SESSION_TYPE=wayland
