# Applications au démarrage (unités app-…@autostart.service générées depuis
# ~/.config/autostart) : après le panneau du bureau d'administration, prêt une
# fois sa zone de notification présente (admin-wait zone-notification).
# S'applique à toutes les unités app-*.service : ce n'est qu'un ordre, sans
# dépendance, sans effet si le panneau ne démarre pas en même temps.
[Unit]
After=aibox-admin-panel.service
