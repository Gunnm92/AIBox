# Lemonade sur aibox : serveur dans l'image, modèles et backends sur le disque
# de données (/srv/models, sous-volume @models sans copie à l'écriture).
[Unit]
ConditionPathIsMountPoint=/srv/models

[Service]
Slice=llm.slice
# Modèles (cache Hugging Face) et backends téléchargés (llama.cpp, sd-cpp,
# whisper.cpp, kokoro, FLM…) ; la configuration reste dans ~/.config/lemonade.
Environment=HF_HOME=/srv/models/huggingface
Environment=LEMONADE_CACHE_DIR=/srv/models/lemonade
# FastFlowLM (NPU) verrouille de la mémoire.
LimitMEMLOCK=infinity
