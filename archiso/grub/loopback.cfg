search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=aibox
timeout=5
timeout_style=menu

menuentry "aibox (RAM)" --class arch --class gnu-linux --id 'aibox' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% copytoram=y
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}
